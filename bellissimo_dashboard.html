<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellissimo Network Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#FFF7EC;
  --card:#FFFFFF;
  --ink:#241A12;
  --ink-soft:#6E5C4E;
  --tomato:#E4572E;
  --tomato-dark:#C43E1C;
  --gold:#F4A100;
  --basil:#3A9D5D;
  --basil-soft:#E4F5EA;
  --danger:#D64545;
  --danger-soft:#FBE6E6;
  --warn-soft:#FFF1D6;
  --line:#F0E3D3;
  --shadow: 0 10px 30px -14px rgba(196,62,28,0.18);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--cream);
  background-image:
    radial-gradient(circle at 6% 4%, rgba(228,87,46,0.07) 0, transparent 40%),
    radial-gradient(circle at 96% 12%, rgba(244,161,0,0.10) 0, transparent 38%);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px;}

/* ---- header ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:linear-gradient(120deg,var(--tomato) 0%, var(--tomato-dark) 100%);
  border-radius:26px;padding:28px 32px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.topbar::after{
  content:"🍕";position:absolute;right:28px;top:50%;transform:translateY(-50%) rotate(-8deg);
  font-size:74px;opacity:0.16;
}
.topbar .eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700;}
.topbar h1{font-size:32px;margin:6px 0 4px;font-weight:700;}
.topbar .sub{font-size:14.5px;opacity:.92;max-width:560px;line-height:1.5;}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.pill{
  background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.35);
  padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:600;
}

/* ---- KPI ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:22px;}
.kpi{
  background:var(--card);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.kpi .num{font-family:'Fredoka',sans-serif;font-size:27px;font-weight:600;line-height:1;color:var(--tomato-dark);}
.kpi .lbl{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.35;font-weight:600;}
.kpi .trend{position:absolute;top:16px;right:14px;font-size:16px;}
.kpi.good .num{color:var(--basil);}
.kpi.warn .num{color:var(--gold);}
.kpi.bad .num{color:var(--danger);}

/* ---- sections ---- */
.section{margin-top:44px;}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
.section-head .idx{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:#fff;
  background:var(--tomato);width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.section-head h2{font-size:21px;margin:0;font-weight:600;}
.section-head .q{font-size:13px;color:var(--ink-soft);margin-left:auto;font-style:italic;}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid4 .card{padding:16px;}
.grid4 table{font-size:12px;}
.grid4 th{padding:7px 6px;font-size:10.5px;}
.grid4 td{padding:7px 6px;}
.card{
  background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;}
.finding{
  margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--warn-soft);
  font-size:13.5px;line-height:1.5;border-left:4px solid var(--gold);
}
.finding.good{background:var(--basil-soft);border-left-color:var(--basil);}
.finding.bad{background:var(--danger-soft);border-left-color:var(--danger);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;color:var(--ink-soft);font-weight:700;font-size:11.5px;
   text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.rank{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--tomato);width:26px;}
.tag{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.tag.strong{background:var(--basil-soft);color:var(--basil);}
.tag.watch{background:var(--warn-soft);color:#9A6A00;}
.tag.risk{background:var(--danger-soft);color:var(--danger);}
.star{color:var(--gold);}

.map-wrap{position:relative;background:#FBF2E4;border-radius:16px;overflow:hidden;border:1px solid var(--line);}
.map-wrap svg{display:block;width:100%;height:auto;}
.legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

.problem-card{
  border-radius:16px;padding:16px 18px;background:var(--danger-soft);border:1px solid #F3C7C7;
}
.problem-card.watch{background:var(--warn-soft);border-color:#F0D8A0;}
.problem-card .name{font-weight:700;font-size:14.5px;font-family:'Fredoka',sans-serif;}
.problem-card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.problem-card .status{margin-top:10px;font-size:12px;font-weight:700;}

.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.rec-list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.85;}
.rec-list li::marker{color:var(--tomato);font-weight:700;}

.chart-box{position:relative;height:260px;}
.chart-box.tall{height:320px;}

.foot{margin-top:56px;text-align:center;color:var(--ink-soft);font-size:12px;line-height:1.7;}

.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.controls input, .controls select{
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:'Manrope',sans-serif;
  font-size:13px;background:#fff;
}
.controls input{flex:1;min-width:180px;}

.src-badge{
  display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;
}
.src-badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;}
.src-card{border-top:4px solid var(--c);}
.mini-kpi-row{display:flex;gap:10px;margin:14px 0 16px;}
.mini-kpi{flex:1;background:#FBF2E4;border-radius:12px;padding:10px 8px;text-align:center;}
.mini-kpi .n{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;color:var(--tomato-dark);}
.mini-kpi.bad .n{color:var(--danger);}
.mini-kpi .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;}
.mini-row{margin-top:10px;}
.lbl-sm{font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.mini-item{font-size:12.5px;margin-top:3px;line-height:1.4;}

@media (max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid2,.grid3,.grid4,.rec-grid{grid-template-columns:1fr;}
}
@media (max-width:1300px) and (min-width:1001px){
  .grid4{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<script>
const RAW = JSON.parse(document.getElementById('raw-data').textContent);
const POINTS = RAW.points;      // combined 2GIS+Google matched dataset (59), used for detail table + gap
const SOURCES = { '2GIS': RAW.gis, 'Google Maps': RAW.google, 'Yandex Maps': RAW.yandex };
const SRC_COLOR = { '2GIS':'#F4A100', 'Google Maps':'#241A12', 'Yandex Maps':'#E4572E' };
const DISTRICT_GEO = RAW.districtGeo;

const fmt = n => Number(n).toLocaleString('ru-RU');
const round1 = n => n==null ? null : Math.round(n*10)/10;
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;

function srcStats(list){
  const rated = list.filter(p=>p.rating!=null);
  const byReviewsDesc = [...list].sort((a,b)=>b.reviews-a.reviews);
  const maxRev = byReviewsDesc[0];
  const minRev = [...byReviewsDesc].reverse()[0];
  const problems = rated.filter(p=>p.rating<3.5);
  return {
    count: list.length,
    avgRating: round1(avg(rated.map(p=>p.rating))),
    maxRev, minRev,
    problemsCount: problems.length,
    problems,
  };
}
const STATS = {}; Object.keys(SOURCES).forEach(k=> STATS[k]=srcStats(SOURCES[k]));

// ---- combined (2GIS+Google) gap dataset, kept for "сверка источников" ----
const withGap = POINTS.filter(p => p.gap!=null);
const avgGap = round1(avg(withGap.map(p=>Math.abs(p.gap))));
const maxGap = round1(Math.max(...withGap.map(p=>Math.abs(p.gap))));
const gapOver05 = withGap.filter(p=>Math.abs(p.gap)>0.5).length;

const app = document.getElementById('app');
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function sectionHead(idx, title, q){
  return `<div class="section-head"><div class="idx">${idx}</div><h2>${title}</h2><div class="q">${q||''}</div></div>`;
}
function srcBadge(name){
  return `<span class="src-badge" style="--c:${SRC_COLOR[name]}">${name}</span>`;
}

// ================= HEADER =================
app.appendChild(el(`
<div class="topbar">
  <div>
    <div class="eyebrow">Bellissimo Pizza · Tashkent</div>
    <h1>Bellissimo Network Intelligence</h1>
    <div class="sub">Сводка по трём источникам — 2GIS, Google Maps, Yandex Maps: масштаб, карта, рейтинги, отзывы и точки риска по каждой платформе отдельно.</div>
    <div class="badge-row">
      <span class="pill">${STATS['2GIS'].count} точек · 2GIS</span>
      <span class="pill">${STATS['Google Maps'].count} точек · Google Maps</span>
      <span class="pill">${STATS['Yandex Maps'].count} точек · Yandex Maps</span>
      <span class="pill">12 районов Ташкента</span>
    </div>
  </div>
</div>
`));

// ================= 01 ОБЩИЙ АНАЛИЗ (по источникам) =================
const s1 = el(`<div class="section" id="s1"></div>`);
s1.innerHTML = sectionHead(1,'Общий анализ','2GIS · Google Maps · Yandex Maps');
const s1grid = el(`<div class="grid3"></div>`);
Object.keys(SOURCES).forEach(src=>{
  const st = STATS[src];
  s1grid.appendChild(el(`
    <div class="card src-card" style="--c:${SRC_COLOR[src]}">
      <h3>${srcBadge(src)}</h3>
      <div class="mini-kpi-row">
        <div class="mini-kpi"><div class="n">${st.count}</div><div class="l">точек</div></div>
        <div class="mini-kpi"><div class="n">${st.avgRating ?? '—'} ★</div><div class="l">ср. рейтинг</div></div>
        <div class="mini-kpi bad"><div class="n">${st.problemsCount}</div><div class="l">проблемных</div></div>
      </div>
      <div class="mini-row"><span class="lbl-sm">Больше всего отзывов</span>
        <div class="mini-item">${st.maxRev.name} <b>· ${fmt(st.maxRev.reviews)} отзывов</b> ${st.maxRev.rating!=null? '· '+st.maxRev.rating+' ★':''}</div></div>
      <div class="mini-row"><span class="lbl-sm">Меньше всего отзывов</span>
        <div class="mini-item">${st.minRev.name} <b>· ${fmt(st.minRev.reviews)} отзывов</b> ${st.minRev.rating!=null? '· '+st.minRev.rating+' ★':''}</div></div>
    </div>
  `));
});
s1.appendChild(s1grid);
app.appendChild(s1);

// ================= 02 КАРТА =================
const s2 = el(`<div class="section" id="s2"></div>`);
s2.innerHTML = sectionHead(2,'Карта сети','Топ по рейтингу на Yandex Maps + границы районов');
s2.appendChild(el(`
  <div class="grid2">
    <div class="card">
      <h3>Границы 12 районов Ташкента · точки с высоким рейтингом на Yandex Maps выделены</h3>
      <div class="map-wrap"><svg id="mapSvg" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="legend">
        <span><span class="dot" style="background:#E4572E;box-shadow:0 0 0 3px rgba(228,87,46,0.25)"></span>Yandex ★ 4.8+ (с координатами)</span>
        <span><span class="dot" style="background:#B9AFA4"></span>Остальные точки сети (2GIS/Google)</span>
      </div>
    </div>
    <div class="card">
      <h3>TOP точки Yandex Maps по рейтингу <span style="font-weight:400;color:var(--ink-soft)">(с сопоставленными координатами)</span></h3>
      <table id="yandexTopTable"><thead><tr><th>#</th><th>Филиал</th><th>★</th><th>Отзывы</th><th>Район</th></tr></thead><tbody></tbody></table>
      <div class="finding">🟡 Выгрузка Yandex Maps не содержит координат. Для карты <b>${SOURCES['Yandex Maps'].filter(p=>p.coord_matched).length}</b> из ${SOURCES['Yandex Maps'].length} точек сопоставлены с координатами 2GIS/Google по адресу (совпадение улицы и номера дома) — это приближение, не точная геолокация Yandex.</div>
    </div>
  </div>
`));
app.appendChild(s2);

// ================= 03 ДЕТАЛИЗАЦИЯ =================
const districtsSet = [...new Set(POINTS.map(p=>p.district))].sort();
const s3 = el(`<div class="section" id="s3"></div>`);
s3.innerHTML = sectionHead(3,'Детализация по филиалам','2GIS + Google Maps, сопоставлено по координатам');
s3.appendChild(el(`
  <div class="card">
    <div class="controls">
      <input id="searchBox" placeholder="Поиск по названию или адресу...">
      <select id="districtFilter"><option value="">Все районы</option>${districtsSet.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
    </div>
    <div style="max-height:420px;overflow:auto">
    <table><thead><tr><th>Филиал</th><th>Район</th><th>★ ср.</th><th>Отзывы</th><th>2GIS</th><th>Google</th><th>Gap</th><th>Статус</th></tr></thead>
    <tbody id="detailBody"></tbody></table>
    </div>
  </div>
`));
app.appendChild(s3);

// ================= 04 ПРОБЛЕМНЫЕ ТОЧКИ (по источникам) =================
const s4 = el(`<div class="section" id="s4"></div>`);
s4.innerHTML = sectionHead(4,'Проблемные точки','Рейтинг ниже 3.5 ★ — по каждому источнику');
const s4grid = el(`<div class="grid3"></div>`);
Object.keys(SOURCES).forEach(src=>{
  const probs = [...STATS[src].problems].sort((a,b)=>a.rating-b.rating);
  s4grid.appendChild(el(`
    <div class="card">
      <h3>${srcBadge(src)} <span style="font-weight:400;color:var(--ink-soft);font-size:12.5px">${probs.length} точек</span></h3>
      ${probs.length ? probs.map(p=>`
        <div class="problem-card" style="margin-bottom:10px">
          <div class="name">${p.name}</div>
          <div class="meta">🔴 ${p.rating} ★ · ${fmt(p.reviews)} отзывов</div>
        </div>`).join('') : `<div class="finding good">🟢 Проблемных точек не найдено.</div>`}
    </div>
  `));
});
s4.appendChild(s4grid);
const allProblemNames = new Set(Object.keys(SOURCES).flatMap(s=>STATS[s].problems.map(p=>p.name)));
s4.appendChild(el(`<div class="finding bad" style="margin-top:16px">🔴 Суммарно по трём источникам под риском (рейтинг &lt; 3.5 хотя бы на одной площадке) находится <b>${allProblemNames.size}</b> уникальных названий филиалов.</div>`));
app.appendChild(s4);

// ================= helper: build top/bottom-N per source cards =================
function topBottomSection(idx, title, q, keyFn, order, n=5){
  const sec = el(`<div class="section"></div>`);
  sec.innerHTML = sectionHead(idx, title, q);
  const grid = el(`<div class="grid3"></div>`);
  Object.keys(SOURCES).forEach(src=>{
    let list = SOURCES[src].filter(p=>keyFn(p)!=null);
    list = [...list].sort((a,b)=> order==='desc' ? keyFn(b)-keyFn(a) : keyFn(a)-keyFn(b)).slice(0,n);
    grid.appendChild(el(`
      <div class="card">
        <h3>${srcBadge(src)}</h3>
        <table><thead><tr><th>#</th><th>Филиал</th><th>Значение</th></tr></thead>
        <tbody>${list.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${p.name}</td><td><b>${keyFn(p)}${title.includes('рейтинг')?' ★':''}</b></td></tr>`).join('')}</tbody></table>
      </div>
    `));
  });
  sec.appendChild(grid);
  return sec;
}

app.appendChild(topBottomSection(5,'TOP-5 · высокий рейтинг','по каждому источнику', p=>p.rating, 'desc'));
app.appendChild(topBottomSection(6,'TOP-5 · низкий рейтинг','по каждому источнику', p=>p.rating, 'asc'));
app.appendChild(topBottomSection(7,'TOP-5 · больше всего отзывов','по каждому источнику', p=>p.reviews, 'desc'));
app.appendChild(topBottomSection(8,'TOP-5 · меньше всего отзывов','по каждому источнику', p=>p.reviews, 'asc'));

// ================= 09 СВЕРКА ИСТОЧНИКОВ =================
const g2Avg = STATS['2GIS'].avgRating, gGAvg = STATS['Google Maps'].avgRating, yAvg = STATS['Yandex Maps'].avgRating;
const byGap = [...withGap].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,10);
const s9 = el(`<div class="section" id="s9"></div>`);
s9.innerHTML = sectionHead(9,'Сверка источников','Насколько согласованы 2GIS, Google и Yandex?');
s9.appendChild(el(`
  <div class="grid2">
    <div class="card"><h3>Средний рейтинг по источникам</h3><div class="chart-box"><canvas id="sourceChart"></canvas></div></div>
    <div class="card">
      <h3>Наибольший Reputation Gap (2GIS ↔ Google)</h3>
      <table><thead><tr><th>Филиал</th><th>2GIS</th><th>Google</th><th>Gap</th></tr></thead>
      <tbody>${byGap.map(p=>`<tr><td>${p.name}</td><td>${p.rating_2gis}</td><td>${p.rating_google}</td><td><b style="color:var(--tomato-dark)">${p.gap>0?'+':''}${p.gap}</b></td></tr>`).join('')}</tbody></table>
      <div class="finding bad" style="margin-top:14px">🔴 <b>${gapOver05}</b> точек имеют расхождение между 2GIS и Google выше 0.5 балла (максимум — ${maxGap}). Средний Gap: <b>${avgGap}</b>.</div>
      <div class="finding">🟡 Yandex Maps в среднем отдаёт Bellissimo <b>${yAvg} ★</b> — заметно выше 2GIS (${g2Avg} ★) и Google (${gGAvg} ★). Так как выгрузка Yandex не содержит координат для всех точек, часть разницы может объясняться иным набором заведений, а не реальным расхождением опыта.</div>
    </div>
  </div>
`));
app.appendChild(s9);

app.appendChild(el(`<div class="foot">Bellissimo Network Intelligence · источники: 2GIS, Google Maps, Yandex Maps (открытые карточки заведений) · координаты Yandex — приближение по адресу, где не удалось сопоставить точно · без вымышленных данных</div>`));

// =========================================================
// ================= CHARTS & MAP RENDER ===================
// =========================================================
Chart.defaults.font.family = "'Manrope', sans-serif";
Chart.defaults.color = '#6E5C4E';

new Chart(document.getElementById('sourceChart'), {
  type:'bar',
  data:{ labels:['2GIS','Google Maps','Yandex Maps'],
    datasets:[{data:[g2Avg,gGAvg,yAvg], backgroundColor:['#F4A100','#241A12','#E4572E'], borderRadius:10, maxBarThickness:60}]},
  options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, suggestedMax:5, grid:{color:'#F0E3D3'}}, x:{grid:{display:false}}} }
});

// ---- map: district boundaries + yandex top-rated points ----
(function renderMap(){
  const svg = document.getElementById('mapSvg');
  const [minLon,maxLon,minLat,maxLat] = DISTRICT_GEO.bbox;
  const W=700,H=520,PAD=14;
  function project(lat,lon){
    const x = PAD + (lon-minLon)/(maxLon-minLon)*(W-2*PAD);
    const y = H-PAD - (lat-minLat)/(maxLat-minLat)*(H-2*PAD);
    return [x,y];
  }
  let content = '';
  const palette = ['#FDEBDD','#FCE3D2','#FBE0DB','#F9E7CF','#F6E2D9','#F3EAD6','#F7E0CE','#F2E6DE','#F9DFCB','#F4E4D3','#F6E7D9','#F0E1D6'];
  DISTRICT_GEO.districts.forEach((d,i)=>{
    d.polygons.forEach(poly=>{
      const pts = poly.map(([lon,lat])=>project(lat,lon).map(v=>v.toFixed(1)).join(',')).join(' ');
      content += `<polygon points="${pts}" fill="${palette[i%palette.length]}" stroke="#E9C9A4" stroke-width="1"><title>${d.name}</title></polygon>`;
    });
  });
  // background 2gis/google points (muted)
  POINTS.filter(p=>p.lat && p.lon).forEach(p=>{
    const [x,y] = project(p.lat,p.lon);
    content += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#B9AFA4" fill-opacity="0.7"/>`;
  });
  // highlighted yandex top-rated matched points
  const yTop = SOURCES['Yandex Maps'].filter(p=>p.coord_matched && p.rating>=4.8);
  yTop.forEach(p=>{
    const [x,y] = project(p.lat,p.lon);
    const r = Math.min(16, 5 + Math.sqrt(p.reviews||1)*0.45);
    content += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#E4572E" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"><title>${p.name} — ${p.rating}★ (${p.reviews} отзывов, Yandex)</title></circle>`;
  });
  svg.innerHTML = content;
})();

// ---- yandex top table ----
(function(){
  const tbody = document.querySelector('#yandexTopTable tbody');
  const top = [...SOURCES['Yandex Maps']].filter(p=>p.rating!=null).sort((a,b)=>b.rating-a.rating || b.reviews-a.reviews).slice(0,10);
  tbody.innerHTML = top.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${p.name}${p.coord_matched?'':' <span style="color:var(--ink-soft);font-size:11px">(без координат)</span>'}</td><td class="star">${p.rating} ★</td><td>${fmt(p.reviews)}</td><td>${p.district}</td></tr>`).join('');
})();

// ---- detail table (combined 2GIS+Google) ----
function statusOf(p){
  if (p.rating==null) return {tag:'watch', label:'Нет данных'};
  if (p.rating < 3.5 || (p.gap!=null && Math.abs(p.gap)>1.5)) return {tag:'risk', label:'Требует проверки'};
  if (p.rating < 4.0) return {tag:'watch', label:'Стабильный'};
  return {tag:'strong', label:'Сильный'};
}
function renderDetailTable(filterText='', filterDistrict=''){
  const body = document.getElementById('detailBody');
  const ft = filterText.toLowerCase();
  const rows = POINTS.filter(p=>{
    const matchText = !ft || p.name.toLowerCase().includes(ft) || (p.address||'').toLowerCase().includes(ft);
    const matchDist = !filterDistrict || p.district === filterDistrict;
    return matchText && matchDist;
  }).sort((a,b)=>(b.rating??0)-(a.rating??0));
  body.innerHTML = rows.map(p=>{
    const st = statusOf(p);
    return `<tr>
      <td>${p.name}</td><td>${p.district}</td>
      <td>${p.rating!=null? p.rating+' ★':'—'}</td><td>${fmt(p.reviews)}</td>
      <td>${p.rating_2gis??'—'}</td><td>${p.rating_google??'—'}</td>
      <td>${p.gap!=null? (p.gap>0?'+':'')+p.gap : '—'}</td>
      <td><span class="tag ${st.tag}">${st.label}</span></td>
    </tr>`;
  }).join('');
}
renderDetailTable();
document.getElementById('searchBox').addEventListener('input', e=>{
  renderDetailTable(e.target.value, document.getElementById('districtFilter').value);
});
document.getElementById('districtFilter').addEventListener('change', e=>{
  renderDetailTable(document.getElementById('searchBox').value, e.target.value);
});

</script>
</body>
